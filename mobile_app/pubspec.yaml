name: pixel_planner_mobile
description: FlowDay schedule assistant rebuilt with Flutter.
publish_to: "none"
version: 5.0.1+50001

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0+1
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  speech_to_text: ^7.4.0
  record: ^7.1.1
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  path_provider: ^2.1.4
  crypto: ^3.0.3
  url_launcher: ^6.3.1
  shared_preferences: ^2.2.0
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/themes/zzz/transform.gif
    - assets/themes/zzz/shield.gif
    - assets/themes/zzz/equipment.gif
    - assets/themes/zzz/flight.gif
    - assets/themes/zzz/rain.gif
